[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strokera"
version = "0.1.0"
description = "Open protocol and CLI for layered, editable stroke painting"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10"
authors = [
    {name = "Strokera Team", email = "team@strokera.dev"}
]
keywords = ["painting", "stroke", "art", "generative", "diffvg", "neural-rendering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
gpu = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
experimental = ["numpy>=1.24", "scipy>=1.11", "Pillow>=10", "opencv-python>=4.8", "click>=8.1", "rich>=13"]
krita = [
    "pybind11>=2.11.0",
]

[project.scripts]
strokera = "strokera.protocol_cli:main"

[project.urls]
Homepage = "https://github.com/huliye24/Strokera"
Repository = "https://github.com/huliye24/Strokera"
Issues = "https://github.com/huliye24/Strokera/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strokera = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "ICN", "PIE", "PYI", "RSE", "RET", "SLF", "SIM", "TCH", "ARG", "PTH", "ERA", "PL", "NPY", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
